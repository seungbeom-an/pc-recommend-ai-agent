<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC 사양 추천 AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#070b14;--panel:#0d1424;--card:#111827;--input:#161f33;
  --ai:#0f1929;--user:#0e2240;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--yellow:#f59e0b;
  --red:#ef4444;--purple:#8b5cf6;--orange:#f97316;
  --text:#e8f0ff;--dim:#8899bb;--muted:#3d5070;
  --border:#1a2840;--bhi:#243855;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;}

/* HEADER */
#hdr{display:flex;align-items:center;gap:12px;padding:11px 20px;background:rgba(7,11,20,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);z-index:100;flex-shrink:0;}
.hlogo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 18px rgba(59,130,246,0.35);}
.htitle{font-size:15px;font-weight:700;}.hsub{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace;}
.hstat{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:var(--dim);}
.hdot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.hrst{background:transparent;border:1px solid var(--bhi);color:var(--dim);padding:5px 12px;border-radius:7px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-left:14px;transition:all .2s;}
.hrst:hover{border-color:var(--blue);color:var(--blue);}

/* MAIN */
#main{flex:1;display:grid;grid-template-columns:1fr 400px;overflow:hidden;min-height:0;}

/* LEFT DASH */
#dash{overflow-y:auto;padding:0;display:flex;flex-direction:column;border-right:1px solid var(--border);}
#dash::-webkit-scrollbar{width:3px;}
#dash::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px;}

/* Tab bar */
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel);}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.3px;}
.tab:hover{color:var(--dim);}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}

/* Tab content */
.tab-content{display:none;flex:1;overflow-y:auto;padding:16px;}
.tab-content.active{display:block;}
.tab-content::-webkit-scrollbar{width:3px;}
.tab-content::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px;}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:14px;color:var(--muted);text-align:center;}
.empty-icon{font-size:44px;opacity:.25;}
.empty p{font-size:13px;line-height:1.8;color:var(--dim);}

/* ── BENCHMARK RANKING TABLE ── */
.rank-section{margin-bottom:20px;}
.rank-title{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.rank-title::after{content:'';flex:1;height:1px;background:var(--border);}
.rank-table{width:100%;border-collapse:collapse;}
.rank-table th{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
.rank-table th:not(:first-child){text-align:right;}
.rank-row{border-bottom:1px solid rgba(26,40,64,0.6);transition:background .15s;cursor:default;}
.rank-row:hover{background:rgba(59,130,246,0.04);}
.rank-row.recommended{background:rgba(6,182,212,0.06);border-left:3px solid var(--cyan);}
.rank-row.recommended:hover{background:rgba(6,182,212,0.1);}
.rank-row td{padding:8px 10px;vertical-align:middle;}
.rk-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:24px;}
.rk-num.gold{color:#fbbf24;}.rk-num.silver{color:#94a3b8;}.rk-num.bronze{color:#b45309;}
.rk-name{font-size:12px;color:var(--text);}
.rk-tag{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;margin-left:5px;vertical-align:middle;}
.rk-badge-rec{background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.4);color:var(--cyan);}
.rk-badge-tier{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.25);color:var(--blue);}
.rk-score{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;}
.rk-bar-cell{width:80px;}
.rk-bar-wrap{height:4px;background:var(--input);border-radius:2px;overflow:hidden;}
.rk-bar-fill{height:100%;border-radius:2px;}
.rk-price{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;white-space:nowrap;}
.rk-price.db{color:var(--green);}
.rk-price.est{color:var(--dim);}
.rk-links{text-align:right;white-space:nowrap;}
.rl{display:inline-flex;align-items:center;font-size:9px;padding:2px 6px;border-radius:3px;text-decoration:none;border:1px solid;transition:all .15s;font-family:'JetBrains Mono',monospace;margin-left:3px;}
.rl.dn{color:#ff8c42;border-color:rgba(255,107,0,.3);background:rgba(255,107,0,.06);}
.rl.dn:hover{background:rgba(255,107,0,.14);}
.rl.nv{color:#19ce60;border-color:rgba(25,206,96,.3);background:rgba(25,206,96,.06);}
.rl.nv:hover{background:rgba(25,206,96,.14);}

/* ── PRICE INFO TAB ── */
.price-summary{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.ps-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.ps-head-left{}
.ps-label{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;}
.ps-total-db{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--green);margin-top:2px;}
.ps-total-ai{font-size:11px;color:var(--dim);margin-top:2px;}
.budget-badge{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;text-align:right;}
.budget-badge.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green);}
.budget-badge.over{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);}
.budget-badge.close{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--yellow);}
.budget-badge small{display:block;font-size:9px;font-weight:400;margin-top:2px;opacity:.8;}

/* Budget track */
.btrack-wrap{padding:10px 16px 14px;border-bottom:1px solid var(--border);}
.btrack-bg{height:8px;background:var(--input);border-radius:4px;position:relative;overflow:visible;}
.btrack-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.btrack-marker{position:absolute;top:-5px;width:2px;height:18px;background:var(--yellow);border-radius:1px;transform:translateX(-50%);}
.btrack-nums{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);}

/* Part rows */
.part-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);gap:10px;}
.part-row:last-child{border-bottom:none;}
.pr-icon{font-size:16px;flex-shrink:0;}
.pr-info{flex:1;min-width:0;}
.pr-label{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.pr-model{font-size:12px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-links{display:flex;gap:4px;margin-top:5px;}
.pr-right{text-align:right;flex-shrink:0;}
.pr-price{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--green);}
.pr-note{font-size:9px;color:var(--muted);margin-top:2px;}
.price-updating{font-size:10px;color:var(--cyan);display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;}
.spinner{width:10px;height:10px;border:2px solid var(--bhi);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Score row */
.score-pills{display:flex;gap:8px;margin-bottom:14px;}
.spill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;}
.spill-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.spill-lbl{font-size:9px;color:var(--muted);margin-top:4px;}
.vpm-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.vpm-lbl{font-size:11px;color:var(--dim);}
.vpm-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--yellow);}

/* RIGHT CHAT */
#chat{display:flex;flex-direction:column;background:var(--panel);overflow:hidden;}
#ca{flex:1;overflow-y:auto;padding:16px 13px;display:flex;flex-direction:column;gap:13px;min-height:0;scroll-behavior:smooth;}
#ca::-webkit-scrollbar{width:3px;}
#ca::-webkit-scrollbar-thumb{background:var(--bhi);border-radius:2px;}
.mr{display:flex;gap:8px;animation:fu .25s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mr.user{flex-direction:row-reverse;}
.av{width:29px;height:29px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px;}
.av.ai{background:linear-gradient(135deg,var(--blue),var(--cyan));}
.av.user{background:var(--input);}
.bu{padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.65;max-width:calc(100% - 40px);}
.bu.ai{background:var(--ai);border:1px solid var(--border);border-top-left-radius:3px;}
.bu.user{background:var(--user);border:1px solid #1a3560;border-top-right-radius:3px;}
.typ{display:flex;gap:4px;padding:3px 0;}
.typ span{width:6px;height:6px;background:var(--blue);border-radius:50%;animation:bo 1.2s infinite;}
.typ span:nth-child(2){animation-delay:.2s}.typ span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chip{padding:5px 11px;background:var(--input);border:1px solid var(--bhi);border-radius:16px;font-size:12px;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Noto Sans KR',sans-serif;}
.chip:hover{background:rgba(59,130,246,.1);border-color:var(--blue);color:var(--blue);}
.mini-spec{background:var(--card);border:1px solid var(--bhi);border-radius:10px;padding:10px 12px;margin-top:8px;}
.ms-title{font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:7px;}
.ms-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;}
.ms-row:last-child{border-bottom:none;}
.ms-k{color:var(--dim);}.ms-v{font-family:'JetBrains Mono',monospace;font-size:10px;}
.ms-total{display:flex;justify-content:space-between;padding:7px 0 0;margin-top:4px;font-size:13px;font-weight:700;}
.ms-warn{font-size:11px;margin-top:6px;padding:7px 10px;border-radius:7px;line-height:1.5;}
.ms-warn.over{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#fca5a5;}
.ms-warn.ok{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);color:#6ee7b7;}
.ms-alt{font-size:10px;color:var(--yellow);margin-top:6px;}
#ia{flex-shrink:0;padding:11px 13px;background:rgba(7,11,20,.92);border-top:1px solid var(--border);}
.iw{display:flex;gap:8px;align-items:flex-end;}
#ui{flex:1;background:var(--input);border:1px solid var(--bhi);border-radius:11px;padding:10px 13px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:none;outline:none;min-height:42px;max-height:110px;line-height:1.5;transition:border-color .2s;}
#ui::placeholder{color:var(--muted);}
#ui:focus{border-color:var(--blue);}
#sb{width:42px;height:42px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;box-shadow:0 0 12px rgba(59,130,246,.3);flex-shrink:0;color:white;}
#sb:hover{transform:scale(1.05);}
#sb:disabled{opacity:.35;cursor:not-allowed;transform:none;}
@media(max-width:800px){#main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}#dash{border-right:none;border-bottom:1px solid var(--border);}}
</style>
</head>
<body>
<div id="hdr">
  <div class="hlogo">💻</div>
  <div><div class="htitle">PC 사양 추천 AI</div><div class="hsub">벤치마크 랭킹 · 실시간 가격 조회 · 구매링크</div></div>
  <div class="hstat"><div class="hdot"></div><span>온라인</span></div>
  <button class="hrst" onclick="resetAll()">↺ 새 대화</button>
</div>

<div id="main">
  <!-- LEFT: DASHBOARD -->
  <div id="dash">
    <div id="tabs">
      <div class="tab active" onclick="switchTab('price')">💰 견적·가격</div>
      <div class="tab" onclick="switchTab('cpu')">🔲 CPU 랭킹</div>
      <div class="tab" onclick="switchTab('gpu')">🎮 GPU 랭킹</div>
    </div>

    <!-- Price Tab -->
    <div class="tab-content active" id="tab-price">
      <div class="empty" id="priceEmpty">
        <div class="empty-icon">💰</div>
        <p>AI와 대화하면<br>실시간으로 가격을 조회하고<br>예산 대비 견적을 보여드립니다</p>
      </div>
    </div>

    <!-- CPU Ranking Tab (always visible) -->
    <div class="tab-content" id="tab-cpu"></div>

    <!-- GPU Ranking Tab (always visible) -->
    <div class="tab-content" id="tab-gpu"></div>
  </div>

  <!-- RIGHT: CHAT -->
  <div id="chat">
    <div id="ca"></div>
    <div id="ia"><div class="iw">
      <textarea id="ui" placeholder="사용 목적, 예산, 선호사항을 말씀해 주세요..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="sb" onclick="sendMsg()">➤</button>
    </div></div>
  </div>
</div>

function findPrice(q) {
  if (!q) return null;
  const s = q.toLowerCase().replace(/[^\w\s가-힣]/g,' ').replace(/\s+/g,' ').trim();
  if (PDB[s]) return PDB[s];
  let best = null, bl = 0;
  for (const [k, v] of Object.entries(PDB)) {
    const kw = k.split(' ');
    if (kw.every(w => s.includes(w)) && k.length > bl) { best = v; bl = k.length; }
  }
  if (!best) {
    for (const [k, v] of Object.entries(PDB)) {
      const kw = k.split(' ');
      const hits = kw.filter(w => s.includes(w));
      if (hits.length >= Math.max(2, kw.length - 1) && k.length > bl) { best = v; bl = k.length; }
    }
  }
  return best;
}

function findCpuBench(q) {
  if (!q) return null;
  const s = q.toLowerCase();
  return CPU_RANK.find(c => s.includes(c.name.toLowerCase()) || c.name.toLowerCase().split(' ').every(w => s.includes(w))) || null;
}
function findGpuBench(q) {
  if (!q) return null;
  const s = q.toLowerCase();
  return GPU_RANK.find(g => s.includes(g.name.toLowerCase()) || g.name.toLowerCase().split(' ').every(w => s.includes(w))) || null;
}

function won(n) {
  if (!n) return '—';
  if (n >= 1000000) return `${(n/10000000<1?(n/10000).toFixed(0)+'만':'약 '+(n/1000000).toFixed(1)+'백만')}원`;
  return `${Math.round(n/10000)}만원`;
}
function won2(n){
  if(!n)return'—';
  const v=Math.round(n/10000);
  return`${v.toLocaleString()}만원`;
}

function sc(v,max){const r=v/max;return r>=.85?'var(--green)':r>=.65?'var(--blue)':r>=.45?'var(--yellow)':'var(--red)';}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function dn(q){return`https://search.danawa.com/dsearch.php?query=${encodeURIComponent(q)}`;}
function nv(q){return`https://search.shopping.naver.com/search/all?query=${encodeURIComponent(q)}`;}

/* Live price fetch: call Claude with web_search to get actual current prices */
async function fetchLivePrices(pinfos) {
  // 모든 부품 가격 조회 (네이버쇼핑 API + 다나와 크롤링)
  for (const p of pinfos) {
    const el = document.getElementById('pr-' + p.key);
    const noteEl = el ? el.closest('.part-row')?.querySelector('.pr-note') : null;
    if (!el) continue;
    el.innerHTML = '<span class="price-updating"><span class="spinner"></span>조회중</span>';
    try {
      const resp = await fetch('/api/price', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: p.model, category: p.label })
      });
      const data = await resp.json();
      if (data.price && data.price > 0) {
        const priceWon = Math.round(data.price / 10000);
        const avgWon = data.avg ? Math.round(data.avg / 10000) : null;
        el.innerHTML = '<span style="color:var(--cyan)">' + priceWon.toLocaleString() + '만원</span>';
        if (noteEl) {
          noteEl.innerHTML = '🔴 실시간 최저가 (' + data.source + ')' +
            (avgWon ? '<br><span style="color:var(--muted);font-size:9px">평균 ' + avgWon.toLocaleString() + '만원</span>' : '');
        }
        // Update price in part slot bar too
        const slotPriceEl = document.getElementById('pp-' + p.key);
        if (slotPriceEl) slotPriceEl.textContent = priceWon.toLocaleString() + '만원';
      } else {
        el.textContent = p.display;
        if (noteEl) noteEl.textContent = p.db ? '📊 DB 평균가' : '🤖 AI 추정';
      }
    } catch(e) {
      el.textContent = p.display;
    }
  }
  // Recalculate total after all prices fetched
  recalcTotal();
}

function recalcTotal() {
  // Sum up all currently displayed prices from pr- elements
  const keys = ['cpu','gpu','ram','storage','case','psu'];
  let total = 0;
  keys.forEach(k => {
    const el = document.getElementById('pr-' + k);
    if (!el) return;
    const txt = el.textContent || el.innerText || '';
    const m = txt.match(/([\d,]+)\s*만원/);
    if (m) total += parseInt(m[1].replace(/,/g,'')) * 10000;
  });
  if (total <= 0) return;
  // Update total display
  const totalEl = document.querySelector('.ps-total-db');
  if (totalEl) totalEl.textContent = Math.round(total/10000).toLocaleString() + '만원';
  const totalAiEl = document.querySelector('.ps-total-ai');
  // Update budget bar
  updateBudgetBar(total);
}

function updateBudgetBar(realTotal) {
  if (!lastBudget || lastBudget <= 0) return;
  const pct = Math.min(realTotal / lastBudget * 100, 130);
  const fillPct = Math.min(pct, 100);
  const fillColor = realTotal > lastBudget ? '#ef4444' : realTotal > lastBudget * 0.92 ? '#f59e0b' : '#10b981';
  const fill = document.querySelector('.btrack-fill');
  if (fill) { fill.style.width = fillPct + '%'; fill.style.background = fillColor; }
  const badge = document.querySelector('.budget-badge');
  if (badge) {
    const over = realTotal > lastBudget;
    const diff = Math.abs(realTotal - lastBudget);
    const diffWon = Math.round(diff/10000).toLocaleString();
    badge.className = 'budget-badge ' + (over ? 'over' : realTotal > lastBudget * 0.92 ? 'close' : 'ok');
    badge.innerHTML = (over ? '⚠️ 예산 초과<small>+' : '✅ 예산 내<small>여유 ') + diffWon + '만원</small>';
  }
}


function scC(v,max){const r=v/max;return r>=.85?'var(--green)':r>=.65?'var(--blue)':r>=.45?'var(--yellow)':'var(--red)';}

function parsePrice(str) {
  if (!str) return 0;
  const m = str.match(/(\d[\d,]*)/); if (!m) return 0;
  const n = parseInt(m[1].replace(/,/g,''));
  if (str.includes('만')) return n*10000;
  if (str.includes('억')) return n*100000000;
  return n;
}

function findCompatScore(cpuName, gpuName) {
  if (!cpuName || !gpuName) return null;
  const c = cpuName.toLowerCase();
  const g = gpuName.toLowerCase();
  let best = null;
  for (const pair of COMPAT_DB.cpu_gpu_pairs) {
    if (c.includes(pair.cpu) && g.includes(pair.gpu)) {
      if (!best || pair.score > best.score) best = pair;
    }
  }
  return best;
}

function findGpuThermal(gpuName) {
  if (!gpuName) return null;
  const g = gpuName.toLowerCase();
  for (const [k, v] of Object.entries(COMPAT_DB.gpu_thermal)) {
    if (g.includes(k)) return { name: k, ...v };
  }
  return null;
}

function findCpuThermal(cpuName) {
  if (!cpuName) return null;
  const c = cpuName.toLowerCase();
  for (const [k, v] of Object.entries(COMPAT_DB.cpu_thermal)) {
    if (c.includes(k.replace('core ','').replace('ryzen ',''))) return { name: k, ...v };
  }
  // broader match
  for (const [k, v] of Object.entries(COMPAT_DB.cpu_thermal)) {
    const kw = k.split(' ').filter(w => w.length > 2);
    if (kw.every(w => c.includes(w))) return { name: k, ...v };
  }
  return null;
}

let hist = [], loading = false, lastBudget = 0;

function extractBudget(text) {
  const m = text.match(/(\d+)\s*만\s*원/);
  if (m) return parseInt(m[1])*10000;
  const m2 = text.match(/(\d+)\s*백\s*만/);
  if (m2) return parseInt(m2[1])*1000000;
  return 0;
}

function buildMiniSpec(d) {
  const parts = ['cpu','gpu','ram','storage','pc_case','psu'];
  const dbTotal = parts.reduce((sum,k)=>sum+(findPrice(d[k])||0),0);
  const realTotal = dbTotal > 0 ? dbTotal : parsePrice(d.total_price);
  const over = lastBudget > 0 && realTotal > lastBudget;

  const rows = [
    ['CPU',d.cpu,d.price_cpu],['GPU',d.gpu,d.price_gpu],
    ['RAM',d.ram,d.price_ram],['SSD',d.storage,d.price_ssd],
    ['케이스',d.pc_case,d.price_case],['파워',d.psu,d.price_psu],
  ].filter(r=>r[1]).map(([k,v,p])=>`
    <div class="ms-row">
      <span class="ms-k">${k}</span>
      <span class="ms-v">${esc((v||'').split(' ').slice(0,4).join(' '))}
        ${p?`<span style="color:var(--green)"> ${esc(p)}</span>`:''}
      </span>
    </div>`).join('');

  const warnHtml = d.budget_note ? `<div class="ms-warn ${d.budget_note.includes('초과')?'over':'ok'}">
    ${d.budget_note.includes('초과')?'⚠️':'✅'} ${esc(d.budget_note)}
  </div>` : '';

  return `<div class="mini-spec">
    <div class="ms-title">📋 ${esc(d.title)}</div>
    ${rows}
    <div class="ms-total">
      <span>🏷️ 총 견적</span>
      <span style="color:var(--green)">${esc(d.total_price||'—')}
        ${dbTotal>0?`<span style="font-size:10px;color:var(--cyan)"> (DB: ${won2(dbTotal)})</span>`:''}
      </span>
    </div>
    ${warnHtml}
    ${d.alternatives?`<div class="ms-alt">💡 ${esc(d.alternatives)}</div>`:''}
  </div>`;
}

function fmtMsg(text) {
  const m = text.match(/```json\s*([\s\S]*?)\s*```/);
  if (m) { try {
    const d = JSON.parse(m[1]);
    if (d.type === 'spec_recommendation') {
      recCpu = d.cpu; recGpu = d.gpu;
      const pre = text.slice(0, text.indexOf('```json')).trim();
      const post = text.slice(text.indexOf('```', text.indexOf('```json')+3)+3).trim();
      let h = '';
      if (pre) h += `<div style="margin-bottom:8px">${esc(pre).replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`;
      h += buildMiniSpec(d);
      if (post) h += `<div style="margin-top:8px;font-size:12px;color:var(--dim)">${esc(post).replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`;
      setTimeout(() => {
        renderPriceTab(d, lastBudget);
        renderCpuTab();
        renderGpuTab();
        switchTab('price');
      }, 100);
      return h;
    }
  } catch(e) { console.error(e); } }
  return esc(text).replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
}

function addMsg(role, content, chips=[]) {
  const area = document.getElementById('ca');
  const row = document.createElement('div'); row.className = 'mr '+role;
  const av = document.createElement('div'); av.className = 'av '+role; av.textContent = role==='ai'?'🤖':'👤';
  const bu = document.createElement('div'); bu.className = 'bu '+role; bu.innerHTML = fmtMsg(content);
  if (chips.length) {
    const cd = document.createElement('div'); cd.className = 'chips';
    chips.forEach(c => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = c; b.onclick = () => qr(c); cd.appendChild(b); });
    bu.appendChild(cd);
  }
  if (role==='ai') { row.appendChild(av); row.appendChild(bu); } else { row.appendChild(bu); row.appendChild(av); }
  area.appendChild(row); area.scrollTop = area.scrollHeight;
}

function rmTyp() { const e = document.getElementById('tr'); if(e) e.remove(); }

async function callC(msg) {
  hist.push({role:'user', content:msg});
  const r = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:2000, system:SYS, messages:hist})
  });
  const data = await r.json();
  const rep = data.content.map(b=>b.text||'').join('');
  hist.push({role:'assistant', content:rep});
  return rep;
}

async function sendMsg() {
  const inp = document.getElementById('ui'); const txt = inp.value.trim();
  if (!txt||loading) return;
  const b = extractBudget(txt); if (b>0) lastBudget = b;
  inp.value = ''; autoResize(inp); loading = true; document.getElementById('sb').disabled = true;
  addMsg('user', txt); showTyp();
  try { const rep = await callC(txt); rmTyp(); addMsg('ai', rep); }
  catch(e) { rmTyp(); addMsg('ai','오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'); }
  loading = false; document.getElementById('sb').disabled = false; document.getElementById('ui').focus();
}
function qr(t) { document.getElementById('ui').value = t; sendMsg(); }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; }

function resetAll() {
  hist=[]; lastBudget=0; recCpu=null; recGpu=null;
